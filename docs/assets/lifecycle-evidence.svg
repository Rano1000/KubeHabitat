<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">KubeHabitat: one identity, distinct lifecycle signals</title>
  <desc id="desc">Ready pods float. Waiting containers pause. Completed tasks show a check. Failed pods show fragments. Every signal links to timestamped Kubernetes evidence; missing data is unknown.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef8f6"/><stop offset="1" stop-color="#e9effb"/></linearGradient></defs>
  <style>text{font-family:system-ui,sans-serif;fill:#183846}.label{font-size:18px;font-weight:650}.note{font-size:14px;fill:#496577}.float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.float{animation:none}}</style>
  <rect width="1000" height="410" rx="24" fill="url(#bg)"/>
  <text x="36" y="42" font-size="13" letter-spacing="2">THE KUBEHABITAT FIELD GUIDE / LIFECYCLE EVIDENCE</text>
  <text x="36" y="79" font-size="29" font-weight="700">See the signal. Inspect the facts.</text>
  <g transform="translate(143 163)"><ellipse cy="62" rx="68" ry="17" fill="#c8e1dd"/><g class="float"><circle r="48" fill="#d5f1e9" stroke="#228468" stroke-width="3"/><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#228468"/></g><text class="label" text-anchor="middle" y="105">Ready</text><text class="note" text-anchor="middle" y="129">Fresh ready signal</text></g>
  <g transform="translate(380 163)"><ellipse cy="62" rx="68" ry="17" fill="#e7ddc6"/><circle r="48" fill="#fff0cc" stroke="#aa710d" stroke-width="3"/><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#aa710d"/><text x="0" y="9" font-size="32" text-anchor="middle" style="fill:white">…</text><text class="label" text-anchor="middle" y="105">Waiting</text><text class="note" text-anchor="middle" y="129">Reason ≠ root cause</text></g>
  <g transform="translate(618 163)"><ellipse cy="62" rx="68" ry="17" fill="#cbd9ec"/><circle r="48" fill="#e0ebff" stroke="#376ba3" stroke-width="3"/><text text-anchor="middle" y="17" font-size="48" style="fill:#376ba3">✓</text><text class="label" text-anchor="middle" y="105">Completed</text><text class="note" text-anchor="middle" y="129">Successful exit is not a crash</text></g>
  <g transform="translate(855 163)"><ellipse cy="62" rx="68" ry="17" fill="#ecd2d1"/><circle r="48" fill="#ffe3e0" stroke="#bd4b43" stroke-width="3"/><text text-anchor="middle" y="17" font-size="48" style="fill:#bd4b43">×</text><path d="M-40 58l14-7 5 17zM12 53l15 6-9 12zM-8 61l8-10 12 17z" fill="#bd4b43"/><text class="label" text-anchor="middle" y="105">Failed</text><text class="note" text-anchor="middle" y="129">Observed failed pod only</text></g>
  <rect x="36" y="321" width="928" height="62" rx="12" fill="#fff" fill-opacity=".8"/>
  <text x="55" y="347" font-size="15" font-weight="650">Click → current status · previous termination · exit code · observation time</text>
  <text x="55" y="370" class="note">? Unknown data  /  ↓ Deletion requested  /  Restart stays within the same pod UID  /  Browser activity is not durable history</text>
</svg>
