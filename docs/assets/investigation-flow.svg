<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Follow an alert to reported evidence</title>
  <desc id="desc">Select the component, inspect exact-UID events, then request current or previous logs. Facts and suggested checks remain distinct.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#233f50}.label{font-size:18px;font-weight:700}.small{font-size:13px;fill:#536b79}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
  <rect width="960" height="300" rx="20" fill="#edf4f7"/>
  <text x="30" y="33" font-size="11" letter-spacing="2">KUBEHABITAT / INVESTIGATION</text>
  <text x="30" y="65" font-size="25" font-weight="700">See the alert. Follow its evidence.</text>
  <g fill="white"><rect x="25" y="88" width="280" height="164" rx="14"/><rect x="340" y="88" width="280" height="164" rx="14"/><rect x="655" y="88" width="280" height="164" rx="14"/></g>
  <g stroke="#7d9dac" stroke-width="2" fill="none"><path d="M309 170h23m-8-7 8 7-8 7M624 170h23m-8-7 8 7-8 7"/></g>
  <g transform="translate(48 104)"><path d="m0 29 31-17 31 17v40L31 86 0 69Z" fill="#b5e2d8" stroke="#3c9286" stroke-width="2"/><path d="m30 45 15-8 15 8v20l-15 8-15-8Z" fill="#ed9595" stroke="#ae4e54" stroke-width="2" class="pulse"/><text x="41" y="60" font-size="18">×</text></g>
  <text x="130" y="130" class="label">01 / Select</text><text x="130" y="154" class="small">Affected box or shell</text><text x="48" y="217" class="small">Colour identifies the component.</text><text x="48" y="239" class="small">Readiness remains a separate fact.</text>
  <g transform="translate(364 109)" stroke="#3c9286" stroke-width="2"><path d="M8 7v75"/><circle cx="8" cy="15" r="5" fill="#efb85c"/><circle cx="8" cy="42" r="5" fill="#b5e2d8"/><circle cx="8" cy="69" r="5" fill="#b5e2d8"/><path d="M23 15h35M23 42h35M23 69h35"/></g>
  <text x="445" y="130" class="label">02 / Events</text><text x="445" y="154" class="small">Exact object UID</text><text x="364" y="217" class="small">Reported reason, count and time.</text><text x="364" y="239" class="small">Retention and limits stay explicit.</text>
  <g transform="translate(679 110)"><rect width="60" height="74" rx="8" fill="#dce9f1" stroke="#638599" stroke-width="2"/><path d="M12 18h36M12 33h27M12 48h36M12 61h21" stroke="#638599" stroke-width="3"/></g>
  <text x="759" y="130" class="label">03 / Logs</text><text x="759" y="154" class="small">Current or previous run</text><text x="679" y="217" class="small">On request · bounded · plain text</text><text x="679" y="239" class="small">Facts first. Checks are guidance.</text>
  <text x="30" y="280" class="small">Workflow illustration · evidence needs read permissions · no automatic root-cause verdict</text>
</svg>
