<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
 <title id="title">KubeHabitat progressive exploration</title><desc id="desc">A cluster overview becomes workload groups, individual replicas and an inspected pod. Warnings and unknown counts remain visible at every level.</desc>
 <style>.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{opacity:.45}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.pulse,.float{animation:none}}text{font-family:system-ui,sans-serif}</style>
 <rect width="1000" height="320" rx="20" fill="#0d1726"/><text x="30" y="38" fill="#73dfcf" font-size="13" letter-spacing="2">KUBEHABITAT · FOLLOW THE DETAIL</text>
 <g fill="#142638" stroke="#365069"><rect x="30" y="65" width="220" height="190" rx="14"/><rect x="270" y="65" width="220" height="190" rx="14"/><rect x="510" y="65" width="220" height="190" rx="14"/><rect x="750" y="65" width="220" height="190" rx="14"/></g>
 <g fill="#e5edf7" font-size="16"><text x="50" y="94">Cluster overview</text><text x="290" y="94">Workload groups</text><text x="530" y="94">Replica page</text><text x="770" y="94">Pod inspection</text></g>
 <path d="M65 155L140 116L215 155V205H65Z" fill="none" stroke="#79aaf0" stroke-width="3"/><g fill="#28465f"><rect x="82" y="163" width="45" height="30" rx="5"/><rect x="151" y="163" width="45" height="30" rx="5"/></g><circle class="pulse" cx="186" cy="170" r="6" fill="#e4be77"/>
 <g fill="none" stroke="#73dfcf" stroke-width="2"><path class="float" d="M335 130L360 145V175L335 190L310 175V145Z"/><path class="float" d="M425 130L450 145V175L425 190L400 175V145Z"/></g><circle class="pulse" cx="445" cy="140" r="7" fill="#e4be77"/>
 <g fill="#73dfcf"><circle cx="555" cy="145" r="9"/><circle cx="590" cy="145" r="9"/><circle cx="625" cy="145" r="9"/><circle cx="660" cy="145" r="9"/><circle cx="695" cy="145" r="9"/><circle cx="555" cy="182" r="9"/><circle cx="590" cy="182" r="9"/><circle cx="625" cy="182" r="9"/></g><circle class="pulse" cx="660" cy="182" r="9" fill="#e4be77"/><circle cx="695" cy="182" r="9" fill="#8594a6"/>
 <g class="float"><path d="M855 118L900 142V188L855 212L810 188V142Z" fill="none" stroke="#e4be77" stroke-width="3"/><rect x="830" y="153" width="22" height="28" rx="4" fill="#e4be77"/><rect x="861" y="153" width="22" height="28" rx="4" fill="#73dfcf"/></g>
 <g fill="#a8bdce" font-size="12"><text x="50" y="233">Counts and node health</text><text x="290" y="233">Controller · node · namespace</text><text x="530" y="233">48 members per page</text><text x="770" y="233">Containers · storage · evidence</text></g>
 <text x="30" y="292" fill="#e4be77" font-size="13">Warnings stay discoverable.</text><text x="300" y="292" fill="#a8bdce" font-size="13">Unknown observations stay unknown. Every real identity remains inspectable.</text>
