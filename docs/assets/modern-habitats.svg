<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Pearl, Aurora and Slate: three new KubeHabitat worlds</title>
<desc id="desc">An open Pearl pavilion with a floating glass capsule, a luminous Aurora atrium with an orbital pod, and a quiet Slate campus with a satin enclosure. Original themes remain available.</desc>
<defs><linearGradient id="pearl" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7eefb"/></linearGradient><linearGradient id="aurora" x2="1" y2="1"><stop stop-color="#343253"/><stop offset="1" stop-color="#171c32"/></linearGradient><linearGradient id="slate" x2="1" y2="1"><stop stop-color="#354351"/><stop offset="1" stop-color="#1d2631"/></linearGradient></defs>
<style>text{font-family:system-ui,sans-serif}.title{font-size:25px;font-weight:650}.caption{font-size:14px}.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.orbit{animation:orbit 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes float{50%{transform:translateY(-6px)}}@keyframes orbit{50%{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){.float,.orbit{animation:none}}</style>
<g transform="translate(0 0)"><rect width="388" height="410" rx="22" fill="url(#pearl)"/><text x="26" y="44" class="title" fill="#26364d">Pearl Habitat</text><text x="26" y="72" class="caption" fill="#617088">Light · airy · quietly elegant</text><path d="M42 310V140h290v170M42 140l145 35 145-35M187 175v135" fill="none" stroke="#9aaec6" stroke-width="2"/><path d="m42 310 145-50 145 50-145 48Z" fill="#d4deee" stroke="#9aaec6"/><g class="float"><rect x="148" y="174" width="80" height="112" rx="39" fill="#eefbfa" fill-opacity=".7" stroke="#168574" stroke-width="2"/><ellipse cx="188" cy="195" rx="27" ry="9" fill="none" stroke="#168574"/><ellipse cx="188" cy="264" rx="27" ry="9" fill="none" stroke="#168574"/><rect x="170" y="211" width="36" height="36" rx="11" fill="#4fa99b"/></g><g transform="translate(279 293)" fill="#6496cc"><circle cy="-26" r="9"/><rect x="-12" y="-14" width="24" height="28" rx="8"/><path d="M-6 13v22m12-22v22" stroke="#6496cc" stroke-width="7"/><path d="M-9-10h18" stroke="#fff" stroke-width="3"/></g><text x="26" y="382" class="caption" fill="#617088">Glass capsules · porcelain modules</text></g>
<g transform="translate(406 0)"><rect width="388" height="410" rx="22" fill="url(#aurora)"/><text x="26" y="44" class="title" fill="#edf0ff">Aurora Habitat</text><text x="26" y="72" class="caption" fill="#b0b6d0">Colourful · immersive · playful</text><path d="M42 310V161q145-72 290 0v149M42 161l145 35 145-35" fill="none" stroke="#a4a0d5" stroke-width="2"/><path d="m42 310 145-50 145 50-145 48Z" fill="#353956" stroke="#737caa"/><g class="float"><circle cx="188" cy="229" r="50" fill="#70ded0" fill-opacity=".08" stroke="#70ded0" stroke-opacity=".45"/><g class="orbit"><ellipse cx="188" cy="229" rx="54" ry="19" fill="none" stroke="#70ded0" stroke-width="2" transform="rotate(-20 188 229)"/><ellipse cx="188" cy="229" rx="54" ry="19" fill="none" stroke="#b2bafa" stroke-width="2" transform="rotate(20 188 229)"/></g><rect x="170" y="211" width="36" height="36" rx="12" fill="#70ded0"/></g><g transform="translate(279 293)" fill="#c6a4f1"><circle cy="-26" r="11"/><rect x="-8" y="-29" width="16" height="6" rx="3" fill="#242a41"/><rect x="-12" y="-12" width="24" height="28" rx="9"/><path d="M-6 16v19m12-19v19" stroke="#c6a4f1" stroke-width="7"/></g><text x="26" y="382" class="caption" fill="#b0b6d0">Orbital pods · astronaut guides</text></g>
<g transform="translate(812 0)"><rect width="388" height="410" rx="22" fill="url(#slate)"/><text x="26" y="44" class="title" fill="#e4edf5">Slate Habitat</text><text x="26" y="72" class="caption" fill="#acbbca">Calm · tailored · focused</text><path d="M42 310V140h290v170M42 140l145 35 145-35" fill="none" stroke="#91a7bb" stroke-width="2"/><path d="m42 310 145-50 145 50-145 48Z" fill="#3e4c5b" stroke="#91a7bb"/><g class="float"><rect x="148" y="180" width="80" height="99" rx="15" fill="#85d3bf" fill-opacity=".07" stroke="#85d3bf" stroke-width="2"/><path d="M153 197h70m-70 65h70" stroke="#85d3bf" stroke-opacity=".55"/><rect x="170" y="211" width="36" height="36" rx="5" fill="#85d3bf"/></g><g transform="translate(279 293)" fill="#8eafcf"><circle cy="-26" r="9"/><rect x="-12" y="-14" width="24" height="28" rx="5"/><path d="M-6 13v22m12-22v22" stroke="#8eafcf" stroke-width="7"/><rect x="-4" y="-6" width="8" height="5" rx="1" fill="#eff5ff"/></g><text x="26" y="382" class="caption" fill="#acbbca">Satin enclosures · technical guides</text></g>
