name: Foundation checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Documentation links
        run: node scripts/check-doc-links.mjs
      - name: Local lab launcher isolation
        run:
          node --test scripts/local-test-cluster.test.mjs scripts/investigation-lab.test.mjs
          scripts/investigation-evidence.test.mjs
      - name: Go formatting, tests, and build
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          go build ./cmd/kubehabitat
      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run test:layout
          npm run build
      - name: Browser integration
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Preserve failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: frontend/test-results
          if-no-files-found: ignore
