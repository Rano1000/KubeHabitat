name: Feature proposal
description: Propose a focused improvement and its visual meaning.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: 'Who needs this, and what are they trying to understand?'
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: 'Explain the observed Kubernetes state behind any visual signal.'
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      description:
        'Identify the roadmap phase, verification approach, accessibility needs, and alternatives.'
    validations:
      required: true
