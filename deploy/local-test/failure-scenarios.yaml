# Opt-in scenarios only. Apply explicitly when checking Waiting and Unscheduled states.
apiVersion: v1
kind: Pod
metadata:
  name: habitat-image-error
  namespace: habitat-lab
  labels:
    app.kubernetes.io/managed-by: kubehabitat-test-lab
spec:
  automountServiceAccountToken: false
  containers:
    - name: unavailable-image
      image: registry.k8s.io/pause:kubehabitat-intentionally-missing
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: habitat-unscheduled
  namespace: habitat-lab
  labels:
    app.kubernetes.io/managed-by: kubehabitat-test-lab
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubehabitat.dev/test-placement: intentionally-unavailable
  containers:
    - name: waiting-for-node
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
