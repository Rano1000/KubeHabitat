# Real topology fixtures. Pause containers do not listen on port 80 or generate traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habitat-shared
  namespace: habitat-lab
  labels: { app.kubernetes.io/managed-by: kubehabitat-test-lab }
spec:
  replicas: 1
  selector:
    matchLabels: { app: habitat-shared }
  template:
    metadata:
      labels: { app: habitat-shared, role: database }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: application
          image: registry.k8s.io/pause:3.10
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
          ports: [{ name: http, containerPort: 80 }]
          volumeMounts:
            [{ name: shared-data, mountPath: /data }, { name: memory-cache, mountPath: /cache }]
        - name: logger-sidecar
          image: registry.k8s.io/pause:3.10
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
          volumeMounts: [{ name: shared-data, mountPath: /data }]
        - name: cache-sidecar
          image: registry.k8s.io/pause:3.10
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
          volumeMounts: [{ name: memory-cache, mountPath: /cache }]
      volumes:
        - name: shared-data
          persistentVolumeClaim: { claimName: habitat-data }
        - name: memory-cache
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: habitat-data
  namespace: habitat-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: { storage: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: habitat-shared
  namespace: habitat-lab
spec:
  selector: { app: habitat-shared }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: habitat-lab
spec:
  podSelector:
    matchLabels: { role: database }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: allowed-client }
      ports: [{ protocol: TCP, port: 80 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: habitat-lab
  labels: { role: allowed-client, app.kubernetes.io/managed-by: kubehabitat-test-lab }
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: registry.k8s.io/pause:3.10
      resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
---
apiVersion: v1
kind: Pod
metadata:
  name: restricted-client
  namespace: habitat-lab
  labels: { role: restricted-client, app.kubernetes.io/managed-by: kubehabitat-test-lab }
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: registry.k8s.io/pause:3.10
      resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: habitat-budget
  namespace: habitat-lab
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 256Mi
    requests.storage: 1Gi
    pods: '12'
