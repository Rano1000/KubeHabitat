# Optional evidence reads. Bind only in namespaces you intend to investigate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubehabitat-investigation
  namespace: habitat-lab
  labels:
    app.kubernetes.io/managed-by: kubehabitat-test-lab
rules:
  - apiGroups: ['']
    resources: [events]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubehabitat-investigation
  namespace: habitat-lab
  labels:
    app.kubernetes.io/managed-by: kubehabitat-test-lab
subjects:
  - kind: ServiceAccount
    name: kubehabitat
    namespace: kubehabitat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubehabitat-investigation
