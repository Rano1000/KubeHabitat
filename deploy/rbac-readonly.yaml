apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubehabitat
  namespace: kubehabitat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubehabitat-observer
rules:
  - apiGroups: ['']
    resources: [nodes, namespaces, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubehabitat-observer
subjects:
  - kind: ServiceAccount
    name: kubehabitat
    namespace: kubehabitat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubehabitat-observer
